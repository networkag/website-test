name = "contact-form-worker"
main = "worker.js"
compatibility_date = "2026-08-01"

# Create with: wrangler kv namespace create RATE_LIMIT_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Set to "*" while testing. Before going live, set this to your real
# site's exact origin, e.g. "https://www.example.com" (no trailing slash).
ALLOWED_ORIGIN = "*"

# Where form submissions get emailed to.
# While testing with the onboarding@resend.dev sender (see README), this
# MUST be the same email address you used to sign up for Resend.
TO_EMAIL = "you@example.com"

# For quick testing, Resend lets you send from "onboarding@resend.dev"
# with no domain setup at all (delivery limited to your own account email).
# Once you verify your own domain in Resend, switch this to an address on it.
FROM_EMAIL = "onboarding@resend.dev"
FROM_NAME = "Website Contact Form"

# Secrets (do NOT put these here) — set with:
#   wrangler secret put TURNSTILE_SECRET_KEY
#   wrangler secret put RESEND_API_KEY
